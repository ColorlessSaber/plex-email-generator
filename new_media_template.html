<!--The go-by template for new media added to server-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weekly Plex Media [server name] server Update</title>
    <style>
        table[class="container"] {
            width: 100%;
        }
        img[class="plex-logo"] {
            width: 100%;
            height: auto;
            border-radius: 30px;
            scale: 50%;
            margin-top: -10%;
            margin-bottom: -10%;
        }
        img[class="poster"] {
            width: 100%;
            height: auto;
            border-radius: 30px;
            scale: 50%;
            margin-top: -30%;
            margin-bottom: -30%;
        }

        td[class="column"] {
            border: solid 1px black;
            border-radius: 15px;
            background-color:whitesmoke;
        }

    </style>
</head>
<body style='margin:0; padding:0; background-color:antiquewhite;'>

<table class='container' style="width:100%">
    <!-- Logo and main header -->
    <tr>
        <td>
            <table class="container">
                <tr>
                    <td>
                        <img src="assets/plex_icon.jpg" alt="Plex icon" class='plex-logo'/>
                    </td>
                </tr>
                <tr>
                    <td style="border: solid 1px black; border-radius: 15px; background-color:#FEC601;">
                        <h1 style="text-align: center;">
                            New Movies/TV Shows have been added! Check it out!
                        </h1>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
    <!-- Media poster sections -->
    <tr>
        <td>
            <table class="container">
                <tr>
                    <td class='column'>
                        <img src="/assets/standard_movie_tv_show_poster.png" alt="Standard movie poster" class='poster'/>
                        <p style="text-align: center; font-size: 30px; font-weight: bold; margin-top: -5%;">
                            Media title
                        </p>
                    </td>
                    <td class='column'>
                        <img src="assets/standard_movie_tv_show_poster.png" alt="Standard movie poster" class='poster'/>
                        <p style="text-align: center; font-size: 30px; font-weight: bold; margin-top: -5%;">
                            Media title
                        </p>
                    </td>
                </tr>
                <tr>
                    <td class='column'>
                        <img src="/assets/standard_movie_tv_show_poster.png" alt="Standard movie poster" class='poster'/>
                        <p style="text-align: center; font-size: 30px; font-weight: bold; margin-top: -5%;">
                            Media title
                        </p>
                    </td>
                    <td class='column'>
                        <img src="assets/standard_movie_tv_show_poster.png" alt="Standard movie poster" class='poster'/>
                        <p style="text-align: center; font-size: 30px; font-weight: bold; margin-top: -5%;">
                            Media title
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
    <!-- Overflow when more than 4 movies/tv shows are added-->
    <tr>
        <td style="border: solid 1px black; border-radius: 15px; background-color:#FEC601;">
            <h1 style="text-align: center;">
                and a
            </h1>
        </td>
    </tr>
</table>

</body>
</html>
